name: RAREFORM — build and deploy

# Builds the storefront on every push that touches it, and publishes to
# Cloudflare Pages when the account secrets are present. Without those secrets
# the job still builds and passes, and says what is missing.

on:
  push:
    paths:
      - 'rareform/**'
      - '.github/workflows/deploy-rareform.yml'
  pull_request:
    paths:
      - 'rareform/**'
  workflow_dispatch:

concurrency:
  group: rareform-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # A push to a PR branch matches both triggers. Run the push event for
    # branches in this repo, and the pull_request event only for forks, which
    # push events cannot see.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rareform
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rareform/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Build single-file bundle
        run: npm run bundle

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: rareform-dist
          path: rareform/dist
          retention-days: 14

      - name: Cloudflare Pages not configured
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: |
          echo "::notice title=Deploy skipped::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to publish this build to Cloudflare Pages. See rareform/DEPLOY.md."

      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: rareform
          command: pages deploy dist --project-name=rareform --branch=${{ github.ref_name }}

  pages:
    # Publishes to GitHub Pages, which is free on a public repository and needs
    # no third-party account. The site lives under /<repo>/, so it is rebuilt
    # with a matching base path.
    name: GitHub Pages
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    defaults:
      run:
        working-directory: rareform

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rareform/package-lock.json

      - name: Install
        run: npm ci

      - name: Build for the Pages subpath
        run: npm run build -- --base=/${{ github.event.repository.name }}/

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: rareform/dist

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
